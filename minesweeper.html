<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지뢰찾기 4×4</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f3;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #1a1a18;
    }

    .container {
      background: #fff;
      border-radius: 16px;
      border: 0.5px solid #e0dfd7;
      padding: 2rem 2.5rem;
      text-align: center;
    }

    h1 { font-size: 20px; font-weight: 500; margin-bottom: 0.5rem; }

    .status {
      font-size: 15px;
      color: #6b6b67;
      margin: 1rem 0 0.5rem;
      min-height: 24px;
    }

    .mine-grid {
      display: grid;
      grid-template-columns: repeat(4, 64px);
      gap: 6px;
      margin: 1rem auto;
      width: fit-content;
    }

    .cell {
      width: 64px; height: 64px;
      border: 0.5px solid #c8c7bf;
      border-radius: 8px;
      background: #f5f5f3;
      font-size: 22px; font-weight: 500;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.1s, transform 0.08s;
      user-select: none;
    }

    .cell:hover:not(.revealed) { background: #ebebea; transform: scale(1.04); }
    .cell.revealed { cursor: default; transform: none; }

    .cell.revealed.safe {
      background: #eaf3de;
      color: #3b6d11;
      border-color: #c0dd97;
    }

    .cell.revealed.mine {
      background: #fcebeb;
      color: #a32d2d;
      border-color: #f7c1c1;
    }

    .cell.revealed.empty {
      background: #ebebea;
      color: #888780;
    }

    .hint {
      font-size: 13px;
      color: #888780;
      margin-bottom: 1.25rem;
    }

    button {
      background: transparent;
      border: 0.5px solid #888780;
      border-radius: 8px;
      padding: 8px 20px;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
      color: #1a1a18;
      transition: background 0.1s, transform 0.08s;
    }

    button:hover { background: #f5f5f3; }
    button:active { transform: scale(0.98); }

  </style>
</head>
<body>

<div class="container">
  <h1>지뢰찾기</h1>
  <div class="status" id="status">아무 칸이나 눌러보세요!</div>
  <div class="mine-grid" id="grid"></div>
  <div class="hint" id="hint"></div>
  <button id="reset-btn">다시 시작</button>
</div>

<script>
(function () {
let mines, revealed, gameOver, cells = [];

const SIZE = 4;
const TOTAL = SIZE * SIZE;
const MINE_COUNT = 3;

function randomInt(max) {
  const arr = new Uint32Array(1);
  crypto.getRandomValues(arr);
  return arr[0] % max;
}

function placeBombs() {
  if (MINE_COUNT >= TOTAL) throw new Error('폭탄 수가 칸 수보다 많습니다');
  const set = new Set();
  while (set.size < MINE_COUNT) set.add(randomInt(TOTAL));
  return set;
}

function neighbors(idx) {
  const row = Math.floor(idx / SIZE), col = idx % SIZE;
  const result = [];
  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      if (dr === 0 && dc === 0) continue;
      const nr = row + dr, nc = col + dc;
      if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE) result.push(nr * SIZE + nc);
    }
  }
  return result;
}

function countAdjacentMines(idx) {
  return neighbors(idx).filter(n => mines.has(n)).length;
}

function resetGame() {
  try {
    mines = placeBombs();
  } catch (e) {
    console.error(e.message);
    return;
  }
  revealed = new Array(TOTAL).fill(false);
  gameOver = false;
  document.getElementById('status').textContent = '아무 칸이나 눌러보세요!';
  document.getElementById('hint').textContent = `${TOTAL}칸 중 폭탄 ${MINE_COUNT}개가 숨겨져 있어요`;
  buildGrid();
}

function buildGrid() {
  const grid = document.getElementById('grid');
  if (!grid) return;
  grid.innerHTML = '';
  cells = [];
  for (let i = 0; i < TOTAL; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.addEventListener('click', () => onLeftClick(i));
    cells[i] = cell;
    grid.appendChild(cell);
  }
  renderAll();
}

function renderCell(idx) {
  const cell = cells[idx];
  if (!cell) return;
  cell.className = 'cell';
  cell.textContent = '';

  if (revealed[idx]) {
    cell.classList.add('revealed');
    if (mines.has(idx)) {
      cell.classList.add('mine');
      cell.textContent = '💣';
    } else {
      const adj = countAdjacentMines(idx);
      if (adj === 0) {
        cell.classList.add('empty');
      } else {
        cell.classList.add('safe');
        cell.textContent = adj;
      }
    }
  }
}

function renderAll() {
  for (let i = 0; i < TOTAL; i++) renderCell(i);
}

function floodReveal(idx) {
  const queue = [idx];
  while (queue.length) {
    const cur = queue.shift();
    if (revealed[cur]) continue;
    revealed[cur] = true;
    renderCell(cur);
    if (countAdjacentMines(cur) === 0) {
      neighbors(cur).forEach(n => { if (!revealed[n] && !mines.has(n)) queue.push(n); });
    }
  }
}

function onLeftClick(idx) {
  if (gameOver || revealed[idx]) return;

  if (mines.has(idx)) {
    gameOver = true;
    revealed = revealed.map(() => true);
    renderAll();
    document.getElementById('status').textContent = '💥 폭탄을 밟았어요!';
    document.getElementById('hint').textContent = '다시 시작을 눌러 새 게임을 시작하세요';
    return;
  }

  floodReveal(idx);

  const safeCount = revealed.filter((r, i) => r && !mines.has(i)).length;
  if (safeCount === TOTAL - MINE_COUNT) {
    gameOver = true;
    document.getElementById('status').textContent = '🎉 성공! 모든 안전한 칸을 찾았어요!';
    document.getElementById('hint').textContent = `폭탄을 피해 ${TOTAL - MINE_COUNT}칸을 모두 열었어요`;
  } else {
    document.getElementById('status').textContent = `${safeCount}칸 열었어요 — 계속해봐요!`;
  }
}


document.getElementById('reset-btn').addEventListener('click', resetGame);
resetGame();
})();
</script>

</body>
</html>
